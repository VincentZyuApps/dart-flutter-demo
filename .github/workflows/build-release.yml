name: Build Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: Create the GitHub Release after all builds pass
        type: boolean
        default: false
      publish_flatpak_repository:
        description: Request a signed Flatpak repository update after publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.41.5
  FLATPAK_APP_ID: io.github.vincentzyuapps.dartflutterdemo

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.trigger.outputs.should_build }}
      should_publish: ${{ steps.trigger.outputs.should_publish }}
      should_publish_flatpak_repository: ${{ steps.trigger.outputs.should_publish_flatpak_repository }}
      version: ${{ steps.version.outputs.version }}
      commits_log: ${{ steps.commits.outputs.log }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Match the exact release trigger
        id: trigger
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MANUAL_PUBLISH: ${{ inputs.publish || false }}
          MANUAL_PUBLISH_FLATPAK: ${{ inputs.publish_flatpak_repository || false }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "$MANUAL_PUBLISH_FLATPAK" == "true" && "$MANUAL_PUBLISH" != "true" ]]; then
              echo "A Flatpak repository update requires publish=true." >&2
              exit 1
            fi
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_publish=$MANUAL_PUBLISH" >> "$GITHUB_OUTPUT"
            echo "should_publish_flatpak_repository=$MANUAL_PUBLISH_FLATPAK" >> "$GITHUB_OUTPUT"
          elif python scripts/ci/common/ci-trigger.py --message "$COMMIT_MESSAGE" --token build-publish; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "should_publish_flatpak_repository=true" >> "$GITHUB_OUTPUT"
          elif python scripts/ci/common/ci-trigger.py --message "$COMMIT_MESSAGE" --token build-release; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "should_publish_flatpak_repository=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "should_publish_flatpak_repository=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version
        id: version
        if: steps.trigger.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)"
          test -n "$FULL_VERSION"
          echo "version=${FULL_VERSION%%+*}" >> "$GITHUB_OUTPUT"

      - name: Collect commit log
        id: commits
        if: steps.trigger.outputs.should_build == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          python scripts/ci/release/collect-commits.py \
            --repository . \
            --head "${{ github.sha }}" \
            --github-output "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: cd packages/system_info_vincentzyu && flutter test
      - run: python -m unittest discover -s test/ci -p 'test_*.py'

  release-builds:
    needs: [prepare, quality]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            flutter_arch: x64
          - platform: linux-x64
            os: ubuntu-22.04
            flutter_arch: x64
          - platform: macos-x64
            os: macos-15-intel
            flutter_arch: x64
          - platform: macos-arm64
            os: macos-latest
            flutter_arch: arm64
          - platform: android
            os: ubuntu-latest
            flutter_arch: x64
          - platform: ios-arm64
            os: macos-latest
            flutter_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Verify committed platform roots
        shell: bash
        run: |
          set -euo pipefail
          for platform in android ios windows linux macos; do
            test -d "$platform"
          done
          if grep -R "com.example" android ios macos; then
            echo "Stale example application identity found." >&2
            exit 1
          fi

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev patchelf libfuse2

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: ${{ matrix.flutter_arch }}
          cache: true

      - run: flutter pub get

      - name: Build Windows Release
        if: matrix.platform == 'windows-x64'
        run: flutter build windows --release

      - name: Package Windows portable build
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath dart-flutter-demo-windows-x64.zip

      - name: Install MSIX packaging dependency
        if: matrix.platform == 'windows-x64'
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Package and validate Windows Store MSIX
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          python scripts/ci/packaging/windows/build-msix.py `
            --bundle build/windows/x64/runner/Release `
            --output dart-flutter-demo-windows-x64-store.msix `
            --identity-name "${{ vars.MS_STORE_IDENTITY_NAME }}" `
            --publisher "${{ vars.MS_STORE_PUBLISHER }}" `
            --publisher-display-name "${{ vars.MS_STORE_PUBLISHER_DISPLAY_NAME }}" `
            --display-name "${{ vars.MS_STORE_DISPLAY_NAME }}"

      - name: Install Inno Setup
        if: matrix.platform == 'windows-x64'
        run: choco install innosetup --no-progress

      - name: Package Windows installer
        if: matrix.platform == 'windows-x64'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ci/packaging/windows/render-iss.py "${{ needs.prepare.outputs.version }}"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" dist/dart-flutter-demo-setup.iss

      - name: Install Linux packaging tool
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -o /tmp/appimagetool.real
          chmod +x /tmp/appimagetool.real
          sudo mv /tmp/appimagetool.real /usr/local/bin/appimagetool.real
          sudo install -m 0755 scripts/ci/packaging/linux/appimagetool-wrapper.sh /usr/local/bin/appimagetool
          dart pub global activate flutter_distributor
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build and package Linux Release
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          flutter_distributor package --skip-clean --platform linux \
            --targets deb,appimage --build-target-platform linux-x64
          tar -C build/linux/x64/release/bundle -czf dart-flutter-demo-linux-x64.tar.gz .

      - name: Preserve Flatpak package input
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/packaging/linux/render-flatpak-metadata.py
          test -x build/linux/x64/release/bundle/dart_flutter_demo
          tar -czf flatpak-package-input.tar.gz \
            build/linux/x64/release/bundle \
            build/flatpak/metadata

      - name: Build macOS Release
        if: startsWith(matrix.platform, 'macos-')
        run: flutter build macos --release

      - name: Package macOS Release
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dart-flutter-demo-${{ matrix.platform }}.zip"
          mkdir -p build/macos/dmg-staging
          cp -R "$APP_PATH" build/macos/dmg-staging/
          ln -s /Applications build/macos/dmg-staging/Applications
          hdiutil detach "/Volumes/DartFlutterDemo" -quiet 2>/dev/null || true
          for attempt in 1 2 3; do
            if hdiutil create -volname "DartFlutterDemo" \
              -srcfolder build/macos/dmg-staging -ov -fs HFS+ -format UDZO \
              "dart-flutter-demo-${{ matrix.platform }}.dmg"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            hdiutil detach "/Volumes/DartFlutterDemo" -quiet 2>/dev/null || true
            sleep 5
          done

      - name: Build Android Release APKs
        if: matrix.platform == 'android'
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Build unsigned iOS Release IPA
        if: matrix.platform == 'ios-arm64'
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          (cd build/ios/ipa && zip -qr dart-flutter-demo-ios-arm64.ipa Payload)

      - name: Upload Windows Release
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            dart-flutter-demo-windows-x64.zip
            dart-flutter-demo-windows-x64-store.msix
            dart-flutter-demo-windows-x64-store.msix.json
            dist/dart-flutter-demo-setup.exe
          retention-days: 7
          if-no-files-found: error

      - name: Upload Linux Release
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            dart-flutter-demo-linux-x64.tar.gz
            flatpak-package-input.tar.gz
            dist/
          retention-days: 7
          if-no-files-found: error

      - name: Upload macOS Release
        if: startsWith(matrix.platform, 'macos-')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dart-flutter-demo-${{ matrix.platform }}.zip
            dart-flutter-demo-${{ matrix.platform }}.dmg
          retention-days: 7
          if-no-files-found: error

      - name: Upload Android Release
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload iOS Release
        if: matrix.platform == 'ios-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: release-ios-arm64
          path: build/ios/ipa/dart-flutter-demo-ios-arm64.ipa
          retention-days: 7
          if-no-files-found: error

  profile-builds:
    needs: [prepare, quality]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            output: build/windows/x64/runner/Profile
          - platform: linux-x64
            os: ubuntu-22.04
            output: build/linux/x64/profile/bundle
          - platform: android-universal
            os: ubuntu-latest
            output: build/app/outputs/flutter-apk/app-profile.apk
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Profile
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            windows-x64) flutter build windows --profile ;;
            linux-x64) flutter build linux --profile ;;
            android-universal) flutter build apk --profile ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: profile-${{ matrix.platform }}
          path: ${{ matrix.output }}
          retention-days: 7
          if-no-files-found: error

  flatpak-package:
    name: Package and verify Flatpak x86_64
    needs: [prepare, release-builds]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux Release input
        uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: .flatpak-input

      - name: Restore Linux bundle and metadata
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .flatpak-input/flatpak-package-input.tar.gz
          test -x build/linux/x64/release/bundle/dart_flutter_demo
          test -f "build/flatpak/metadata/${FLATPAK_APP_ID}.metainfo.xml"

      - name: Validate desktop and AppStream metadata
        shell: bash
        run: |
          set -euo pipefail
          desktop-file-validate \
            "linux/packaging/flatpak/${FLATPAK_APP_ID}.desktop"
          appstreamcli validate --no-net \
            "build/flatpak/metadata/${FLATPAK_APP_ID}.metainfo.xml"

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@bf5cafdfd97dcf5a89c7475bbc86a616e1f86acb # v6.7
        with:
          bundle: dart-flutter-demo-linux-x64-v${{ needs.prepare.outputs.version }}.flatpak
          manifest-path: linux/packaging/flatpak/io.github.vincentzyuapps.dartflutterdemo.yml
          branch: stable
          arch: x86_64
          repository-name: flathub
          repository-url: https://dl.flathub.org/repo/flathub.flatpakrepo
          cache-key: flatpak-builder-x86_64-25.08-${{ hashFiles('linux/packaging/flatpak/**', 'pubspec.lock') }}
          upload-artifact: false
          verbose: true

      - name: Verify package identity, version, sandbox, and startup
        shell: bash
        run: |
          bash scripts/ci/packaging/linux/verify-flatpak-package.sh \
            "dart-flutter-demo-linux-x64-v${{ needs.prepare.outputs.version }}.flatpak" \
            "${{ needs.prepare.outputs.version }}"

      - name: Upload verified Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: release-flatpak-x64
          path: |
            dart-flutter-demo-linux-x64-v${{ needs.prepare.outputs.version }}.flatpak
            build/flatpak/metadata/io.github.vincentzyuapps.dartflutterdemo.metainfo.xml
            flatpak-info.txt
            flatpak-permissions.txt
            flatpak-smoke.log
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [prepare, release-builds, profile-builds, flatpak-package]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Version and collect Release files
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p release-files
          cp artifacts/release-windows-x64/dart-flutter-demo-windows-x64.zip \
            "release-files/dart-flutter-demo-windows-x64-v${VERSION}.zip"
          cp artifacts/release-windows-x64/dist/dart-flutter-demo-setup.exe \
            "release-files/dart-flutter-demo-windows-x64-v${VERSION}-setup.exe"
          cp artifacts/release-windows-x64/dart-flutter-demo-windows-x64-store.msix \
            "release-files/dart-flutter-demo-windows-x64-store-v${VERSION}.msix"
          cp artifacts/release-linux-x64/dart-flutter-demo-linux-x64.tar.gz \
            "release-files/dart-flutter-demo-linux-x64-v${VERSION}.tar.gz"
          cp "artifacts/release-flatpak-x64/dart-flutter-demo-linux-x64-v${VERSION}.flatpak" \
            "release-files/dart-flutter-demo-linux-x64-v${VERSION}.flatpak"
          find artifacts/release-linux-x64 -type f \( -name '*.deb' -o -name '*.AppImage' \) -print0 | while IFS= read -r -d '' file; do
            extension="${file##*.}"
            cp "$file" "release-files/dart-flutter-demo-linux-x64-v${VERSION}.${extension}"
          done
          for arch in x64 arm64; do
            cp "artifacts/release-macos-${arch}/dart-flutter-demo-macos-${arch}.dmg" \
              "release-files/dart-flutter-demo-macos-${arch}-v${VERSION}.dmg"
            cp "artifacts/release-macos-${arch}/dart-flutter-demo-macos-${arch}.zip" \
              "release-files/dart-flutter-demo-macos-${arch}-v${VERSION}.zip"
          done
          cp artifacts/release-android/app-release.apk \
            "release-files/dart-flutter-demo-android-universal-v${VERSION}.apk"
          cp artifacts/release-android/app-arm64-v8a-release.apk \
            "release-files/dart-flutter-demo-android-arm64-v${VERSION}.apk"
          cp artifacts/release-android/app-x86_64-release.apk \
            "release-files/dart-flutter-demo-android-x86_64-v${VERSION}.apk"
          cp artifacts/release-ios-arm64/dart-flutter-demo-ios-arm64.ipa \
            "release-files/dart-flutter-demo-ios-arm64-v${VERSION}.ipa"
          (cd artifacts/profile-windows-x64 && zip -qr \
            "../../release-files/dart-flutter-demo-windows-x64-profile-v${VERSION}.zip" .)
          tar -C artifacts/profile-linux-x64 -czf \
            "release-files/dart-flutter-demo-linux-x64-profile-v${VERSION}.tar.gz" .
          cp artifacts/profile-android-universal/app-profile.apk \
            "release-files/dart-flutter-demo-android-universal-profile-v${VERSION}.apk"

      - name: Create Flatpak repository publication request
        if: needs.prepare.outputs.should_publish_flatpak_repository == 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          jq -n \
            --arg app_id "$FLATPAK_APP_ID" \
            --arg arch "x86_64" \
            --arg branch "stable" \
            --arg bundle "dart-flutter-demo-linux-x64-v${VERSION}.flatpak" \
            --arg release_tag "v${VERSION}" \
            --arg repository "VincentZyuApps/flatpak-repo" \
            '{
              schema_version: 1,
              app_id: $app_id,
              arch: $arch,
              branch: $branch,
              bundle: $bundle,
              release_tag: $release_tag,
              repository: $repository
            }' > release-files/flatpak-publish-request.json

      - name: Render Release notes
        shell: bash
        env:
          COMMITS_LOG: ${{ needs.prepare.outputs.commits_log }}
        run: |
          python3 scripts/ci/release/render-release-notes.py \
            --repository "${{ github.repository }}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --sha "${{ github.sha }}" \
            --commits "$COMMITS_LOG" \
            --output release_body.md

      - name: Upload manual dry-run bundle
        if: needs.prepare.outputs.should_publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-v${{ needs.prepare.outputs.version }}
          path: |
            release-files/*
            release_body.md
          retention-days: 7
          if-no-files-found: error

      - name: Create GitHub Release
        if: needs.prepare.outputs.should_publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: dart-flutter-demo v${{ needs.prepare.outputs.version }}
          body_path: release_body.md
          files: release-files/*
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
