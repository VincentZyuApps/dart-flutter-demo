name: Check Flatpak Package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-flatpak-repo-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.41.5
  FLATPAK_APP_ID: io.github.vincentzyuapps.dartflutterdemo

jobs:
  build-linux-bundle:
    name: Build Linux x64 bundle
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          architecture: x64
          cache: true

      - run: flutter pub get

      - name: Build Linux Release bundle
        run: flutter build linux --release

      - name: Render versioned AppStream metadata
        run: python3 scripts/ci/packaging/linux/render-flatpak-metadata.py

      - name: Preserve Flatpak package input
        shell: bash
        run: |
          set -euo pipefail
          test -x build/linux/x64/release/bundle/dart_flutter_demo
          tar -czf flatpak-package-input.tar.gz \
            build/linux/x64/release/bundle \
            build/flatpak/metadata

      - name: Upload internal package input
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-package-input-${{ github.run_id }}
          path: flatpak-package-input.tar.gz
          retention-days: 1
          if-no-files-found: error

  flatpak-package-only:
    name: Package and verify Flatpak x86_64
    needs: build-linux-bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download internal package input
        uses: actions/download-artifact@v4
        with:
          name: flatpak-package-input-${{ github.run_id }}
          path: .flatpak-input

      - name: Restore Linux bundle and metadata
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf .flatpak-input/flatpak-package-input.tar.gz
          test -x build/linux/x64/release/bundle/dart_flutter_demo
          test -f "build/flatpak/metadata/${FLATPAK_APP_ID}.metainfo.xml"

      - name: Validate desktop and AppStream metadata
        shell: bash
        run: |
          set -euo pipefail
          desktop-file-validate \
            "linux/packaging/flatpak/${FLATPAK_APP_ID}.desktop"
          appstreamcli validate --no-net \
            "build/flatpak/metadata/${FLATPAK_APP_ID}.metainfo.xml"

      - name: Extract package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -1)"
          test -n "$FULL_VERSION"
          echo "version=${FULL_VERSION%%+*}" >> "$GITHUB_OUTPUT"

      - name: Build package-only Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@bf5cafdfd97dcf5a89c7475bbc86a616e1f86acb # v6.7
        with:
          bundle: dart-flutter-demo-linux-x64-v${{ steps.version.outputs.version }}.flatpak
          manifest-path: linux/packaging/flatpak/io.github.vincentzyuapps.dartflutterdemo.yml
          branch: stable
          arch: x86_64
          repository-name: flathub
          repository-url: https://dl.flathub.org/repo/flathub.flatpakrepo
          cache-key: flatpak-builder-x86_64-25.08-${{ hashFiles('linux/packaging/flatpak/**', 'pubspec.lock') }}
          upload-artifact: false
          verbose: true

      - name: Verify package identity, version, sandbox, and startup
        shell: bash
        run: |
          bash scripts/ci/packaging/linux/verify-flatpak-package.sh \
            "dart-flutter-demo-linux-x64-v${{ steps.version.outputs.version }}.flatpak" \
            "${{ steps.version.outputs.version }}"

      - name: Upload package-only Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-package-only-${{ github.run_id }}
          path: |
            dart-flutter-demo-linux-x64-v${{ steps.version.outputs.version }}.flatpak
            build/flatpak/metadata/io.github.vincentzyuapps.dartflutterdemo.metainfo.xml
            flatpak-info.txt
            flatpak-permissions.txt
            flatpak-smoke.log
          retention-days: 7
          if-no-files-found: error
