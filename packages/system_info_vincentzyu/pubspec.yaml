name: system_info_vincentzyu
description: Typed cross-platform system information with source diagnostics and fallbacks.
version: 0.1.0
publish_to: none
repository: https://github.com/VincentZyuApps/dart-flutter-demo/tree/main/packages/system_info_vincentzyu

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.vincentzyuapps.system_info_vincentzyu
        pluginClass: SystemInfoVincentzyuPlugin
      ios:
        pluginClass: SystemInfoVincentzyuPlugin
      macos:
        pluginClass: SystemInfoVincentzyuPlugin
      windows:
        pluginClass: SystemInfoVincentzyuPluginCApi
  assets:
    - assets/windows/SystemInfo.ps1
