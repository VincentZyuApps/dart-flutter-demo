name: windows_desktop_integration_vincentzyu
description: Windows taskbar integration - jump list entries, thumbnail toolbar buttons, and single instance forwarding.
version: 0.1.0
publish_to: none
repository: https://github.com/VincentZyuApps/dart-flutter-demo/tree/main/packages/windows_desktop_integration_vincentzyu

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: WindowsDesktopIntegrationVincentzyuPluginCApi
