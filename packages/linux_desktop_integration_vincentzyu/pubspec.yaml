name: linux_desktop_integration_vincentzyu
description: Linux desktop integration helpers - single instance activation over D-Bus, an MPRIS now playing bridge, desktop notifications and window activation.
version: 0.1.0
publish_to: none
repository: https://github.com/VincentZyuApps/dart-flutter-demo/tree/main/packages/linux_desktop_integration_vincentzyu

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  dbus: ^0.8.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: LinuxDesktopIntegrationVincentzyuPlugin
